<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f0f1ec'/%3E%3Crect x='9' y='4' width='1.5' height='24' fill='%23d3d7c9'/%3E%3Crect x='8' y='11' width='3.5' height='10' rx='1.75' fill='%233d3bd4'/%3E%3Crect x='15' y='9' width='11' height='1.6' rx='.8' fill='%231c1f1b'/%3E%3Crect x='15' y='15' width='9' height='1.6' rx='.8' fill='%231c1f1b'/%3E%3Crect x='15' y='21' width='11' height='1.6' rx='.8' fill='%231c1f1b'/%3E%3C/svg%3E">
</head>
<body class="page">

<header class="topbar">
  <div class="topbar__identity">
    <h1 class="topbar__title">Library</h1>
    <p class="topbar__meta" id="meta"></p>
  </div>

  <div class="topbar__search">
    <label class="field">
      <span class="field__key">/</span>
      <input type="search" id="search-input" placeholder="Search every transcript" autocomplete="off" spellcheck="false">
    </label>
  </div>

  <div class="topbar__actions">
    <nav class="tabs">
      <a class="btn" href="/" aria-current="page">Recordings</a>
      <a class="btn" href="/quotes">Quotes</a>
      <a class="btn" href="/themes">Themes</a>
    </nav>
    <button class="btn btn--icon" id="theme-toggle" type="button" title="Switch theme" aria-label="Switch theme">◐</button>
  </div>
</header>

<div class="notices" id="notices"></div>

<main class="sheet" id="sheet">
  <section class="results-strip" id="results-strip" hidden>
    <header class="sheet__head">
      <h2 class="sheet__title">Search results</h2>
      <span class="sheet__count" id="search-count"></span>
    </header>
    <div id="search-results"></div>
  </section>

  <section>
    <header class="sheet__head">
      <h2 class="sheet__title">Recordings</h2>
      <span class="sheet__count" id="recording-count"></span>
    </header>
    <div class="cards" id="recordings"></div>
  </section>

  <section id="tags-section" hidden>
    <header class="sheet__head">
      <h2 class="sheet__title">Tags across the library</h2>
      <span class="sheet__count" id="tag-count"></span>
    </header>
    <div class="tag-rail" id="tag-rail"></div>
  </section>
</main>

<script type="module" src="/static/library.js"></script>
</body>
</html>
