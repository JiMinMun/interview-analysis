<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcript</title>
<link rel="stylesheet" href="/static/styles.css">
<!-- Inlined so the page makes no requests the server did not already answer. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f0f1ec'/%3E%3Crect x='9' y='4' width='1.5' height='24' fill='%23d3d7c9'/%3E%3Crect x='8' y='11' width='3.5' height='10' rx='1.75' fill='%233d3bd4'/%3E%3Crect x='15' y='9' width='11' height='1.6' rx='.8' fill='%231c1f1b'/%3E%3Crect x='15' y='15' width='9' height='1.6' rx='.8' fill='%231c1f1b'/%3E%3Crect x='15' y='21' width='11' height='1.6' rx='.8' fill='%231c1f1b'/%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <div class="topbar__identity">
    <h1 class="topbar__title" id="title">Transcript</h1>
    <p class="topbar__meta" id="meta"></p>
  </div>

  <div class="topbar__search">
    <label class="field">
      <span class="field__key">/</span>
      <input type="search" id="search-input" placeholder="Find a quote" autocomplete="off" spellcheck="false">
    </label>
    <button class="toggle" id="regex-toggle" type="button" aria-pressed="false" title="Match with a regular expression">.*</button>
  </div>

  <div class="topbar__actions">
    <a class="btn" id="library-link" href="/" hidden>← Library</a>
    <button class="btn" id="tab-search" type="button" aria-pressed="false">Results</button>
    <button class="btn" id="tab-highlights" type="button" aria-pressed="true">Quotes <span class="count" id="highlight-count">0</span></button>
    <button class="btn btn--icon" id="theme-toggle" type="button" title="Switch theme" aria-label="Switch theme">◐</button>
  </div>
</header>

<div class="notices" id="notices"></div>
<div class="roster" id="roster" hidden></div>
<div class="timing" id="timing" hidden></div>

<div class="workspace">
  <main class="reader" id="reader" tabindex="-1">
    <div class="transcript" id="transcript">
      <div class="spine-marker" id="spine-marker" hidden>
        <span class="spine-marker__dot" id="spine-dot" hidden></span>
      </div>
      <div class="chunks" id="chunks"></div>
    </div>
  </main>

  <aside class="sidebar" id="sidebar">
    <section class="panel" id="panel-search" hidden>
      <header class="panel__head">
        <h2 class="panel__title">Results</h2>
        <span class="panel__count" id="search-count"></span>
      </header>
      <div class="panel__body" id="search-results">
        <p class="empty">Search the transcript to find a quote. Exact matches come first, then close ones.</p>
      </div>
    </section>

    <section class="panel" id="panel-highlights">
      <header class="panel__head">
        <h2 class="panel__title">Quotes</h2>
        <span class="panel__count" id="highlights-path"></span>
        <a class="icon-btn panel__tool" id="code-link" href="/quotes" target="_blank" rel="noopener"
           title="Code these quotes in the quotes-only view, in a new tab">Code ↗</a>
        <button class="icon-btn panel__tool" id="sidebar-expand" type="button" aria-pressed="false"
                title="Widen the quotes panel">⇤</button>
      </header>
      <div class="panel__filters" id="tag-filters"></div>
      <div class="panel__body" id="highlight-list">
        <p class="empty">Select text in the transcript to save a quote. Quotes are written to a JSON file next to the recording.</p>
      </div>
    </section>
  </aside>
</div>

<div class="dock" id="dock" data-state="minimized">
  <div class="dock__grip" id="dock-grip" role="separator" aria-orientation="horizontal"
       tabindex="0" aria-label="Resize video — drag, or use the arrow keys"></div>
  <div class="dock__stage" id="dock-stage">
    <video id="media" playsinline preload="metadata"></video>
  </div>
  <div class="dock__bar">
    <button class="transport" id="play" type="button" aria-label="Play">▶</button>
    <span class="clock" id="clock">0:00</span>
    <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <span class="clock clock--muted" id="duration">0:00</span>
    <label class="rate">
      <span class="rate__label">speed</span>
      <select class="rate__select" id="rate" aria-label="Playback speed">
        <option value="0.5">0.5&times;</option>
        <option value="0.75">0.75&times;</option>
        <option value="1" selected>1&times;</option>
        <option value="1.25">1.25&times;</option>
        <option value="1.5">1.5&times;</option>
        <option value="1.75">1.75&times;</option>
        <option value="2">2&times;</option>
      </select>
    </label>
    <button class="follow" id="follow" type="button" hidden>Follow along</button>
    <button class="btn btn--icon" id="dock-toggle" type="button" title="Expand video">▣</button>
  </div>
</div>

<div class="quotebar" id="quotebar" hidden>
  <span class="quotebar__time" id="quotebar-time">0:00</span>
  <div class="quotebar__colors" id="quotebar-colors"></div>
  <button class="quotebar__action" id="quotebar-note" type="button">Save with note</button>
  <button class="quotebar__action" id="quotebar-copy" type="button">Copy</button>
  <span class="quotebar__hand" id="quotebar-hand" hidden></span>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
